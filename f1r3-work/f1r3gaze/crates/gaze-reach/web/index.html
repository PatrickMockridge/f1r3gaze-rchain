<!doctype html>
<html><head><meta charset="utf-8"><title>F1R3Gaze reach tier</title>
<style>body{font-family:system-ui,sans-serif;margin:48px auto;max-width:640px;padding:0 24px}
button{font:inherit;padding:8px 16px;border:1px solid #9aa4b5;border-radius:6px;background:#fff}
button.lit{background:#ffcf3f;border-color:#c79a00}</style></head>
<body>
<h1>F1R3Gaze, reach tier</h1>
<p>This page's behaviour is a f1r3lang program running in a WebAssembly build of the
F1R3Gaze executive. It holds one capability, the document.</p>
<p><button id="lamp">lamp</button></p>
<script type="application/f1r3lang" imports="doc">
new found, sub, clicks, on, off in {
  doc!("query1", "#lamp", *found) |
  for (@("ok", *lamp) <- found) {
    lamp!("listen", "click", *clicks, {}, *sub) |
    off!(Nil) |
    for (_ <= clicks & _ <- off) { lamp!("classAdd", "lit") | on!(Nil) } |
    for (_ <= clicks & _ <- on)  { lamp!("classRemove", "lit") | off!(Nil) }
  }
}
</script>
<script type="module" src="gaze-reach.js"></script>
</body></html>
